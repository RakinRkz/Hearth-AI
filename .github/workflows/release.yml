name: Release

# Cutting a release: push a tag like v1.0.0. workflow_dispatch is there so the
# build can be exercised without creating a tag or a public release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v), e.g. 1.0.0"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # 3.11 rather than latest: llama-cpp-python publishes prebuilt wheels for
      # it, and the runner has no C++ toolchain to fall back on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # The extra index carries prebuilt llama-cpp-python wheels. Without it pip
      # attempts a source build and fails on the missing compiler.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install pyinstaller

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Build application bundle
        run: pyinstaller build.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test the bundle
        shell: bash
        run: |
          test -f dist/HearthAI/HearthAI.exe || { echo "exe missing"; exit 1; }
          test -f dist/HearthAI/_internal/frontend/dist/index.html || { echo "frontend not bundled"; exit 1; }
          test -f dist/HearthAI/_internal/assets/hearth.png || { echo "icon not bundled"; exit 1; }
          echo "bundle contents look right"

      # Signing is optional and skipped entirely when the secrets are absent, so
      # forks and unsigned builds still work. Without a certificate Windows
      # SmartScreen warns on first run; no code change can avoid that, only a
      # real Authenticode signature can. Set WINDOWS_CERT_BASE64 (a base64 .pfx)
      # and WINDOWS_CERT_PASSWORD to enable.
      - name: Sign application executable
        if: env.CERT != ''
        env:
          CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT))
          & signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            dist\HearthAI\HearthAI.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          mkdir -Force dist\installer
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.value }} installer\hearth.iss

      # Sign the installer too - the exe signature inside it is not what
      # SmartScreen checks when the user downloads and runs Setup.
      - name: Sign installer
        if: env.CERT != ''
        env:
          CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          Get-ChildItem dist\installer\*.exe | ForEach-Object {
            & signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }

      - uses: actions/upload-artifact@v4
        with:
          name: HearthAI-Setup-${{ steps.version.outputs.value }}
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
          draft: true
          body: |
            ## Hearth AI ${{ steps.version.outputs.value }}

            A private, offline AI assistant. Chat with local LLMs, ask questions
            over your own documents, and search the web - all on your machine.

            ### Install (Windows)

            Download **HearthAI-Setup-${{ steps.version.outputs.value }}.exe** and run it.
            No admin rights are needed; it installs for the current user only.

            On first launch Hearth AI offers to download a starter model
            (Phi-3.5 Mini, ~2.4GB). Nothing is sent anywhere: the model runs locally.

            Hearth AI lives in your system tray. On Windows 11 new tray icons start
            hidden behind the `^` chevron - pin it there to keep it visible.

            ### Notes

            - The installer is unsigned, so SmartScreen will warn on first run.
              Choose **More info -> Run anyway**.
            - Your data (models, chats, documents) is kept in
              `%LOCALAPPDATA%\HearthAI` and is left in place when uninstalling
              unless you ask for it to be removed.
